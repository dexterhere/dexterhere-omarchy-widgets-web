version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native port: it has no JS compiler API yet, so SvelteKit's sync step and
      # svelte-check fail ("Cannot read properties of undefined (reading 'readFile')"). Revisit when
      # both support it. Minor and patch updates of 5.x still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
