name: ci
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run themes:check
      - run: bun run registry -- ${{ github.event_name == 'pull_request' && '--strict' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: only maintainers change review records
        if: github.event_name == 'pull_request'
        # Run the guard as it is on the BASE branch, not the copy in the PR: a PR cannot weaken
        # its own check. A missing script fails closed. Branch protection with code-owner review
        # is still what stops a PR from editing this workflow file (see SECURITY.md).
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE}:scripts/check-review-changes.ts" > "${RUNNER_TEMP}/guard.ts"
          bun "${RUNNER_TEMP}/guard.ts"
      - run: bunx vitest run --passWithNoTests
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the build reads each widget repo; unauthenticated calls hit the shared rate limit
          PUBLIC_BUILD_COMMIT: ${{ github.sha }} # shown (7 characters) in the footer
          STATS_DEMO: '1' # keeps the unlinked test route for e2e; production builds prune it
      - name: build the host-mode site (localhost + docs.localhost) for the hosts e2e project
        run: bun run build:hosts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          PORT: '4174' # the hosts project serves PW_PORT + 1 (4173 + 1)
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --pass-with-no-tests # both projects: chromium (path mode) and hosts
      - name: dependency audit
        run: bun audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
