name: ci
on:
  push:
    branches: [main, staging, develop]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run themes:check
      - run: bun run registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: only maintainers change review records
        run: bun scripts/check-review-changes.ts
      - run: bunx vitest run --passWithNoTests
      - run: bun run build
        env:
          STATS_DEMO: '1' # keeps the unlinked test route for e2e; production builds prune it
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --pass-with-no-tests
      - name: dependency audit
        run: bun audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
