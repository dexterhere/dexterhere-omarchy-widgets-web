name: Site or docs problem
description: Something on the website or in the docs is wrong, broken or unclear
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Security problem? Do not post it here; use the private links on the previous page. Remove secrets and personal data from anything you paste.'
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: 'What did you do, and what did you see?'
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: input
    id: url
    attributes:
      label: Page URL
      description: 'The address of the page where it happened'
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and system
      description: 'For example Firefox 130 on Omarchy'
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      description: 'Optional. A screenshot helps, with secrets removed.'
